name: Diagnose CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-ci.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Run pipeline and capture diagnostics
        run: |
          set +e
          {
            echo '## pnpm install --frozen-lockfile'
            pnpm install --frozen-lockfile
            echo "EXIT_INSTALL=$?"
            echo
            echo '## pnpm lint'
            pnpm lint
            echo "EXIT_LINT=$?"
            echo
            echo '## pnpm test'
            pnpm test
            echo "EXIT_TEST=$?"
            echo
            echo '## pnpm build'
            pnpm build
            echo "EXIT_BUILD=$?"
          } > ci-diagnostics.txt 2>&1
          cat ci-diagnostics.txt
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-diagnostics.txt
          git commit -m "ci: capture pipeline diagnostics"
          git push
