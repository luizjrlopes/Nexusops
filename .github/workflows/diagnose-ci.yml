name: Diagnose CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-ci.yml'

permissions:
  contents: write

env:
  DATABASE_URL: postgresql://nexusops:nexusops@localhost:5432/nexusops
  JWT_SECRET: nexusops-ci-secret
  NEXT_PUBLIC_API_URL: http://localhost:3001

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Run pipeline and capture diagnostics
        run: |
          set +e
          {
            echo '## pnpm install --no-frozen-lockfile'
            pnpm install --no-frozen-lockfile
            echo "EXIT_INSTALL=$?"
            echo
            echo '## pnpm validate:static'
            pnpm validate:static
            echo "EXIT_STATIC=$?"
            echo
            echo '## pnpm lint'
            pnpm lint
            echo "EXIT_LINT=$?"
            echo
            echo '## pnpm test'
            pnpm test
            echo "EXIT_TEST=$?"
            echo
            echo '## pnpm build'
            pnpm build
            echo "EXIT_BUILD=$?"
          } > ci-diagnostics.txt 2>&1
          cat ci-diagnostics.txt
      - name: Commit lockfile and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml ci-diagnostics.txt
          if git diff --cached --quiet; then
            echo "No diagnostics changes to commit."
            exit 0
          fi
          git commit -m "ci: refresh lockfile and pipeline diagnostics"
          git push
